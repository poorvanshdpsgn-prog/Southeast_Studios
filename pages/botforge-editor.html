<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f15">
<title>BotForge Game Editor | Southeast Studios</title><link rel="stylesheet" href="../botforge/editor/editor.css">
<style>.variable-row{display:grid;grid-template-columns:1fr 95px 1fr 30px;gap:7px;margin:6px 0}.variable-row input,.variable-row select{min-width:0;padding:6px;background:#10212b;color:#e3f7fa;border:1px solid #294650;border-radius:5px}.variables-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.variables-columns h3{margin:0 0 9px;color:#b8d4d9}.console-line{font:11px monospace;padding:3px;color:#93adb4}.muted{color:#78919a;font-size:11px}.canvas-shell{position:relative}.bf-toast-spacer{height:0}@media(max-width:780px){.variables-columns{grid-template-columns:1fr}}</style>
</head>
<body>
<div class="app">
<header class="topbar"><a class="brand" href="dashboard.html">BOTFORGE</a><span class="crumb">2D GAME ENGINE</span><input id="projectName" class="project-title" aria-label="Project name"><span id="saveState" class="save-state">● Loading…</span><div class="top-actions"><span id="userEmail" class="user-pill"></span><button id="signOutBtn" class="btn" title="Sign out">Sign out</button><button id="undoBtn" class="icon-btn" title="Undo (Ctrl/Cmd+Z)">↶</button><button id="redoBtn" class="icon-btn" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button><button id="saveBtn" class="btn">Save</button><button id="previewBtn" class="btn play">▶ Preview</button><button id="stopBtn" class="btn stop hidden">■ Stop</button><button id="settingsBtn" class="btn" title="Project settings">⚙</button><button id="exportBtn" class="btn">Export JSON</button><button id="importBtn" class="btn">Import</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></header>
<div class="workarea">
<aside class="leftbar"><div class="scene-head"><span>Scenes</span><button id="addScene" class="icon-btn" title="Create scene">＋</button></div><select id="sceneSelect" class="scene-select" aria-label="Active scene"></select><div class="scene-buttons"><button id="renameScene" class="btn">Rename</button><button id="duplicateScene" class="btn">Copy</button><button id="deleteScene" class="btn danger">Delete</button></div>
<div class="section-head"><span>Engine panels</span></div><div class="tool-tabs"><button class="tool-tab active" data-tool="objects">▣ Objects</button><button class="tool-tab" data-tool="assets">▧ Assets</button><button class="tool-tab" data-tool="behaviors">◈ Behaviors</button><button class="tool-tab" data-tool="events">⌁ Events</button><button class="tool-tab" data-tool="variables"># Variables</button><button class="tool-tab" data-tool="audio">♫ Audio</button></div><div id="toolPanel" class="tool-panel"></div></aside>
<section class="center"><div class="canvas-toolbar"><span>SCENE CANVAS</span><label><input id="gridToggle" type="checkbox" checked> Grid</label><label><input id="snapToggle" type="checkbox" checked> Snap</label><span>Zoom</span><select id="zoomSelect"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select><span id="sceneSize"></span></div><div id="canvasWrap" class="canvas-wrap"><div class="canvas-shell"><canvas id="gameCanvas"></canvas><div id="previewBanner" class="preview-banner hidden">PREVIEW · ARROWS/WASD MOVE · SPACE JUMP</div></div></div><div class="coordbar"><span id="coordReadout">X 0 · Y 0</span><span id="selectionReadout">No selection</span><span>Drag to move · drag corner to resize · Alt+drag to pan</span></div></section>
<aside class="inspector"><div class="inspector-title"><strong>INSPECTOR</strong><button id="duplicateObject" class="icon-btn" title="Duplicate selected object (Ctrl/Cmd+D)">⧉</button><button id="deleteObject" class="icon-btn danger" title="Delete selected object">⌫</button></div><div id="inspectorPanel"><div class="empty">Select an object to edit its properties.</div></div></aside>
</div>
<section class="bottom"><div class="bottom-tabs"><button class="bottom-tab active" data-bottom="events">Events / Logic</button><button class="bottom-tab" data-bottom="variables">Variables</button><button class="bottom-tab" data-bottom="console">Console</button><button id="addEvent" class="btn" style="margin-left:auto">＋ Add Event</button></div><div id="bottomContent" class="bottom-content"></div></section>
</div><div id="toastHost"></div><div id="modalHost"></div>
<script type="module" src="../botforge/editor/editor.js"></script>
</body></html>
